<section id="contact">
  <div class="section-head reveal">
    <p class="eyebrow">Get In Touch</p>
    <h2>Contact</h2>
    <div class="rule"></div>
    <p class="contact-intro">For collaborations, opportunities, or inquiries, please feel free to reach out. I would be delighted to hear from you.</p>
  </div>

  <form class="contact-box reveal" id="contactForm">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" type="text" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" required>
    </div>
    <div class="field">
      <label for="subject">Subject</label>
      <input id="subject" type="text" required>
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" required></textarea>
    </div>
    <button type="submit" class="btn btn-solid">Send Message</button>
    <p class="form-status" id="formStatus"></p>
  </form>

  <div class="social-row reveal">
  <a href="https://www.facebook.com/linatoc.jr.rodelito" class="social-icon" aria-label="Facebook" target="_blank" rel="noopener noreferrer">FB</a>
  <a href="https://www.instagram.com/direct/t/17842320944801246/" class="social-icon" aria-label="Instagram" target="_blank" rel="noopener noreferrer">IG</a>
  <a href="mailto:2520710@ub.edu.com" class="social-icon" aria-label="Gmail" target="_blank" rel="noopener noreferrer">✉</a>
</div>
</section>
